<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario - InvSys</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dark-theme">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-name">InvSys</span>
      </div>
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <p class="user-name" id="user-name">Administrador</p>
          <p class="user-role" id="user-role">Rol: Admin</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-view="inventario" onclick="window.location.href='index.html'">Inventario</button>
        <button class="nav-btn" data-view="nueva-venta" onclick="window.location.href='nueva_ventana.html'">Nueva Venta</button>
        <button class="nav-btn" data-view="historial" onclick="window.location.href='historial.html'">Historial</button>
        <button class="nav-btn" data-view="usuarios" onclick="window.location.href='Usuarios.html'">Usuarios</button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-btn nav-btn-danger" id="btn-cerrar-sesion">Cerrar Sesión</button>
        <button class="nav-btn nav-btn-outline" id="btn-cambiar-tema">Cambiar Tema</button>
      </div>
    </aside>
    <main class="main-content">
      <section class="view active" id="view-inventario">
        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Inventario de Productos</h2>
          </div>
          <input type="text" id="buscador-inventario" class="search-input" placeholder="Buscar producto..." />
          <div class="toolbar-actions">
            <button class="btn btn-danger" id="btn-eliminar">Eliminar</button>
            <button class="btn btn-secondary" id="btn-editar">Editar</button>
            <button class="btn btn-primary" id="btn-agregar">+ Agregar</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="tabla-inventario">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Costo</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Unidad</th>
              </tr>
            </thead>
            <tbody id="tbody-inventario"></tbody>
          </table>
        </div>
        <footer class="stock-alert" id="stock-alert" style="display:none;">
          <span class="alert-icon">!</span>
          <span id="stock-alert-text">Stock bajo: </span>
        </footer>
      </section>
    </main>
  </div>
  <div class="modal-overlay" id="modal-producto" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-titulo">Agregar Producto</h3>
        <button class="modal-close" data-close-modal="modal-producto">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="modal-codigo-original" />
        <div class="form-row">
          <div class="form-group"><label>Código</label><input type="text" id="modal-codigo" placeholder="PROD001" /></div>
          <div class="form-group"><label>Nombre</label><input type="text" id="modal-nombre" placeholder="Nombre del producto" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Categoría</label><input type="text" id="modal-categoria" placeholder="Electrónica" /></div>
          <div class="form-group"><label>Unidad</label><input type="text" id="modal-unidad" placeholder="pieza" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Costo ($)</label><input type="number" id="modal-costo" placeholder="0.00" min="0" step="0.01" /></div>
          <div class="form-group"><label>Precio ($)</label><input type="number" id="modal-precio" placeholder="0.00" min="0" step="0.01" /></div>
          <div class="form-group"><label>Stock</label><input type="number" id="modal-stock" placeholder="0" min="0" /></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal="modal-producto">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-producto">Guardar</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
