<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Venta - InvSys</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dark-theme">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-name">InvSys</span>
      </div>
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <p class="user-name" id="user-name">Administrador</p>
          <p class="user-role" id="user-role">Rol: Admin</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn" data-view="inventario" onclick="window.location.href='index.html'">Inventario</button>
        <button class="nav-btn active" data-view="nueva-venta" onclick="window.location.href='nueva_ventana.html'">Nueva Venta</button>
        <button class="nav-btn" data-view="historial" onclick="window.location.href='historial.html'">Historial</button>
        <button class="nav-btn" data-view="usuarios" onclick="window.location.href='Usuarios.html'">Usuarios</button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-btn nav-btn-danger" id="btn-cerrar-sesion">Cerrar Sesión</button>
        <button class="nav-btn nav-btn-outline" id="btn-cambiar-tema">Cambiar Tema</button>
      </div>
    </aside>
    <main class="main-content">
      <section class="view active" id="view-nueva-venta">
        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Nueva Venta</h2>
          </div>
          <input type="text" id="buscador-venta" class="search-input" placeholder="Buscar producto para agregar..." />
        </div>
        <div class="venta-layout">
          <div class="venta-productos">
            <h3 class="section-label">Productos disponibles</h3>
            <div class="table-wrapper">
              <table id="tabla-venta-productos">
                <thead>
                  <tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th></th></tr>
                </thead>
                <tbody id="tbody-venta-productos"></tbody>
              </table>
            </div>
          </div>
          <div class="carrito-panel">
            <h3 class="section-label">Carrito</h3>
            <div id="carrito-items" class="carrito-lista"></div>
            <div class="carrito-total">
              <span>Total:</span>
              <strong id="carrito-total-valor">$0.00</strong>
            </div>
            <button class="btn btn-primary btn-block" id="btn-confirmar-venta">Confirmar Venta</button>
          </div>
        </div>
      </section>
    </main>
  </div>
 <div class="toast" id="toast"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
