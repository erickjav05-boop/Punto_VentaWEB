<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial - InvSys</title>
  <link rel="stylesheet" href="../static/style.css" />
</head>
<body class="dark-theme">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">📦</span>
        <span class="brand-name">InvSys</span>
      </div>
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <p class="user-name" id="user-name">Administrador</p>
          <p class="user-role" id="user-role">Rol: Admin</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn" data-view="inventario" onclick="window.location.href='index.html'">Inventario</button>
        <button class="nav-btn" data-view="nueva-venta" onclick="window.location.href='nueva_ventana.html'">Nueva Venta</button>
        <button class="nav-btn active" data-view="historial" onclick="window.location.href='historial.html'">Historial</button>
        <button class="nav-btn" data-view="usuarios" onclick="window.location.href='Usuarios.html'">Usuarios</button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-btn nav-btn-danger" id="btn-cerrar-sesion">Cerrar Sesión</button>
        <button class="nav-btn nav-btn-outline" id="btn-cambiar-tema">Cambiar Tema</button>
      </div>
    </aside>
    <main class="main-content">
      <section class="view active" id="view-historial">
        <div class="toolbar">
          <div class="toolbar-title">
            <span class="toolbar-icon">📋</span>
            <h2>Historial de Ventas</h2>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="tabla-historial">
            <thead>
              <tr><th>ID Venta</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Vendedor</th></tr>
            </thead>
            <tbody id="tbody-historial"></tbody>
          </table>
        </div>
        <p class="empty-msg" id="historial-vacio">No hay ventas registradas aún.</p>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="../static/main.js"></script>
</body>
</html>
